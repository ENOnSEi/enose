; PlatformIO project — ENose ESP32-S3 MQTT node
;
; Reads the 4 TGS gas sensors and publishes the readings over MQTT, and
; receives base/medicion/cooldown/stop commands from the API over MQTT.
; Same payloads as the legacy WebSocket firmware, different transport.

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_deps =
    knolleary/PubSubClient@^2.8
