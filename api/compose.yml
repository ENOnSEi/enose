services:
  db:
    image: postgres:16-alpine
    container_name: enose-db
    environment:
      - POSTGRES_USER=enose
      - POSTGRES_PASSWORD=enose
      - POSTGRES_DB=enose_db
    ports:
      - "5432:5432"
    volumes:
      - enose-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U enose -d enose_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: enose-api
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://enose:enose@db:5432/enose_db
      - DEBUG=False
    depends_on:
      db:
        condition: service_healthy

volumes:
  enose-db-data:
